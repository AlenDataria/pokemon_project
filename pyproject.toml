[project]
name = "pokemon-etl"
version = "0.1.0"
description = "Pokemon ETL Pipeline"
requires-python = ">=3.11"

dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "polars>=1.0",
    "duckdb>=1.0",
    "pytest>=8.0",
    "pyarrow>=24.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
